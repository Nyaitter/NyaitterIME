name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - name: Check release version
        run: |
          node -e "const v=require('./package.json').version; if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='v'+v) throw Error('Tag must match package.json version');"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish package
        run: npm publish --access public --provenance
      - name: Confirm package is publicly available
        run: |
          node --input-type=module <<'JS'
          import pkg from './package.json' with { type: 'json' };
          for (let attempt = 0; attempt < 6; attempt++) {
            const response = await fetch(`https://registry.npmjs.org/${pkg.name}/${pkg.version}`);
            if (response.ok) process.exit(0);
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('Version is not live. Check npm Staged Packages for approval, or configure trusted publishing for this workflow.');
          JS
